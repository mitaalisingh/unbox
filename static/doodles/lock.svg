<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
<style>
.l{fill:none;stroke:#e7e5d9;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.o{stroke:#e2693a}
.t{stroke:#5ba39a}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s ease-out forwards}
.d2{animation-delay:.35s}.d3{animation-delay:.7s}
@keyframes draw{to{stroke-dashoffset:0}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}
.tw2{animation-delay:.6s}.tw3{animation-delay:1.1s}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.d{stroke-dashoffset:0}}
.sh{animation:sh 3s ease-in-out infinite}
@keyframes sh{0%,35%{transform:translateY(-14px)}50%,85%{transform:translateY(0)}100%{transform:translateY(-14px)}}
.bd{animation:bd 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bd{0%,45%,100%{transform:rotate(0)}52%{transform:rotate(-3deg)}58%{transform:rotate(3deg)}64%{transform:rotate(0)}}
</style>
<g class="sh"><path class="l d" pathLength="1" d="M64 96 V74 a36 36 0 0 1 72 0 V96"/></g>
<g class="bd">
<rect class="l d d2" pathLength="1" x="46" y="94" width="108" height="78" rx="14"/>
<circle class="l o d d3" pathLength="1" cx="100" cy="128" r="8"/>
<path class="l o d d3" pathLength="1" d="M100 136 V152"/>
</g>
<path class="l t tw" d="M160 50 v12 M154 56 h12"/>
<path class="l o tw tw2" d="M38 60 v9 M33.5 64.5 h9"/>
</svg>
