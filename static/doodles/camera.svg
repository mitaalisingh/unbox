<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
<style>
.l{fill:none;stroke:#e7e5d9;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.o{stroke:#e2693a}
.t{stroke:#5ba39a}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s ease-out forwards}
.d2{animation-delay:.35s}.d3{animation-delay:.7s}
@keyframes draw{to{stroke-dashoffset:0}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}
.tw2{animation-delay:.6s}.tw3{animation-delay:1.1s}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.d{stroke-dashoffset:0}}
.lens{transform-box:fill-box;transform-origin:center;animation:lens 2s ease-in-out infinite}
@keyframes lens{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.fl{animation:fl 2s ease-in-out infinite}
@keyframes fl{0%,60%,100%{opacity:.1}70%,85%{opacity:1}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
<g class="bob">
<path class="l d" pathLength="1" d="M38 72 h30 l8 -14 h48 l8 14 h30 a10 10 0 0 1 10 10 v66 a10 10 0 0 1 -10 10 h-124 a10 10 0 0 1 -10 -10 v-66 a10 10 0 0 1 10 -10z"/>
<circle class="l d d2" pathLength="1" cx="100" cy="116" r="30"/>
<circle class="l d d2" pathLength="1" cx="100" cy="116" r="19"/>
<circle class="lens" cx="100" cy="116" r="6" fill="#e2693a"/>
<path class="l d d3" pathLength="1" d="M86 104 q6 -8 16 -9"/>
<path class="l d d3" pathLength="1" d="M146 84 h10"/>
</g>
<g class="fl"><path class="l o" d="M150 40 l-4 -12 M162 46 l9 -9 M168 58 l12 -3"/></g>
<path class="l t tw" d="M36 40 v12 M30 46 h12"/>
</svg>
