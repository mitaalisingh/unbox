{% extends "auth/base.html" %}
{% block title %}Unbox{% endblock %}
{% block topbar %}<header class="topbar"><span class="brand">Unbox</span></header>{% endblock %}
{% block content %}
<h1>Enter the password</h1>
<p class="lead">To see what's inside, enter the password you were given.</p>
<form method="post" action="{{ url_for('viewer_unlock', tid=tid) }}" class="glass addbox" style="margin-top:14px">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="nid" value="{{ nid or '' }}">
  <label>Password <input type="password" name="password" required autocomplete="off" autocapitalize="none" autofocus></label>
  <button class="primary" type="submit">Show me</button>
</form>
{% endblock %}
