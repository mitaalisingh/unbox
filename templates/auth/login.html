{% extends "auth/base.html" %}
{% block title %}Log in · Unbox{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="glass addbox" style="margin-top:14px">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Email <input type="email" name="email" value="{{ email }}" required autocomplete="email" autocapitalize="none"></label>
  <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
  <button class="primary" type="submit">Log in</button>
</form>
<p class="muted"><a href="{{ url_for('forgot') }}">Forgot your password?</a> · <a href="{{ url_for('signup') }}">Create an account</a></p>
{% endblock %}
