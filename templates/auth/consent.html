{% extends "auth/base.html" %}
{% block title %}One more step · Unbox{% endblock %}
{% block content %}
<h1>One more step</h1>
<p class="muted">Before you continue, please confirm:</p>
<form method="post" class="glass addbox">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label class="check"><input type="checkbox" name="age18" required> I am 18 or older</label><br>
  <label class="check"><input type="checkbox" name="terms" required> <span>I have read the <a href="{{ url_for('privacy') }}" target="_blank">privacy notice</a> and I agree</span></label>
  <button class="primary" type="submit">Continue</button>
</form>
{% endblock %}
