{% extends "auth/base.html" %}
{% block title %}Reset your password · Unbox{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<p class="muted">Enter your email and we'll send a link to choose a new password.</p>
<form method="post" class="glass addbox">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Email <input type="email" name="email" required autocomplete="email" autocapitalize="none"></label>
  <button class="primary" type="submit">Send the link</button>
</form>
{% endblock %}
