{% extends "auth/glass.html" %}
{% block title %}Reset your password · Unbox{% endblock %}
{% block glass %}
<h1 class="gh"><b>No worries!</b><br>Let's reset it</h1>
<p class="gsub">Enter your email and we'll send a link to choose a new password.</p>
<form method="post" class="gform">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input type="email" name="email" placeholder="E-mail address" aria-label="E-mail address" required autocomplete="email" autocapitalize="none">
  <button class="glassbtn" type="submit">Send the link</button>
</form>
<p class="gfoot"><a href="{{ url_for('login') }}">Back to log in</a></p>
{% endblock %}
