{% extends "auth/base.html" %}
{% block title %}Unbox{% endblock %}
{% block topbar %}<header class="topbar"><span class="brand">Unbox</span><a class="back" href="{{ go }}">Skip</a></header>{% endblock %}
{% block content %}
<script>try { if (localStorage.getItem('unbox-no-intro')) { location.replace({{ go|tojson }}); } } catch (e) {}</script>
{% set public = true %}{% include "auth/_intro.html" %}
<p class="legalrow"><a href="{{ url_for('privacy') }}">Privacy notice</a> · <a href="{{ url_for('about') }}">About the creator</a></p>
{% endblock %}
