{% extends "auth/glass.html" %}
{% block title %}Create an account · Unbox{% endblock %}
{% block glass %}
<h1 class="gh"><b>Welcome!</b><br>Let's get you set up</h1>
<form method="post" class="gform">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input name="name" placeholder="First name (optional)" aria-label="First name (optional)" maxlength="40" autocomplete="given-name">
  <input type="email" name="email" value="{{ email }}" placeholder="E-mail address" aria-label="E-mail address" required autocomplete="email" autocapitalize="none">
  {% if invite_required %}<input name="invite" placeholder="Invite code" aria-label="Invite code" required autocomplete="off" autocapitalize="none">{% endif %}
  <input type="password" name="password" placeholder="Password (10+ characters)" aria-label="Password" required minlength="10" autocomplete="new-password">
  <input type="password" name="password2" placeholder="Type it again" aria-label="Type the password again" required minlength="10" autocomplete="new-password">
  <label class="gcheck"><input type="checkbox" name="age18" required> I am 18 or older</label>
  <label class="gcheck"><input type="checkbox" name="terms" required> <span>I have read the <a href="{{ url_for('privacy') }}" target="_blank">privacy notice</a> and I agree</span></label>
  <button class="glassbtn" type="submit">Create account</button>
</form>
<p class="gfoot">Already have one? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
