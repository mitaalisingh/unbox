{% extends "auth/base.html" %}
{% block title %}Choose a new password · Unbox{% endblock %}
{% block content %}
<h1>Choose a new password</h1>
<form method="post" class="glass addbox">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>New password (at least 10 characters) <input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
  <label>Type it again <input type="password" name="password2" required minlength="10" autocomplete="new-password"></label>
  <button class="primary" type="submit">Save password</button>
</form>
{% endblock %}
