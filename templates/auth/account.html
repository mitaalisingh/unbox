{% extends "auth/base.html" %}
{% block title %}Your profile · Unbox{% endblock %}
{% block content %}
<div class="chips"><a class="chip" href="{{ url_for('trips') }}">Trips</a></div>
<h1>Your profile</h1>
<p class="lead">{{ user_email }}</p>
<ul class="stack">
  <li><a class="glass boxcard" href="{{ url_for('change_password') }}" style="min-height:64px"><span class="txt"><strong>Change password</strong></span>
    <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></a></li>
</ul>
<ul class="stack">
  <li><a class="glass boxcard" href="{{ url_for('welcome') }}" style="min-height:64px"><span class="txt"><strong>How Unbox works</strong></span>
    <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></a></li>
</ul>
<form method="post" action="{{ url_for('logout') }}">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <button class="danger" type="submit">Log out</button>
</form>
<p style="text-align:center;margin-top:28px"><a href="{{ url_for('delete_account') }}" class="muted small" style="text-decoration:underline">Delete my account</a></p>
{% endblock %}
