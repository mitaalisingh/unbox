services:
  - type: web
    name: unbox
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: SUPABASE_URL
        sync: false          # you type these in the Render dashboard; never commit them
      - key: SUPABASE_PUBLIC_KEY
        sync: false
      - key: INVITE_CODES
        sync: false          # comma-separated codes you choose; sign-up needs one
      - key: SECRET_KEY
        generateValue: true  # Render makes a random one so logins survive restarts
      - key: BEHIND_PROXY
        value: "1"
